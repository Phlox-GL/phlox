name: Temporary formal Option migration

on:
  pull_request:
    paths:
      - migration/option-public031.cirru
      - .github/workflows/option-migration.yaml

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit
          deps-file: deps.cirru
      - name: Apply the explicit guarded source transaction
        run: |
          set -euo pipefail
          out=.calcit/option-migration
          mkdir -p "$out"
          git hash-object calcit.cirru > "$out/before-blob.txt"
          calcit query type ":: 'Option 'Number" --format json > "$out/option-methods.json"
          jq -e '[.data.methods[] | select(.name == ".unwrap" or .name == ".unwrap-or") | .definition] | sort == ["calcit.core/option:unwrap", "calcit.core/option:unwrap-or"]' "$out/option-methods.json"
          calcit edit transaction --file migration/option-public031.cirru --dry-run --format json > "$out/preview.json"
          revision="$(jq -er '.scoped_revision' "$out/preview.json")"
          jq -e '.changed == true and (.operations | length) == 569' "$out/preview.json"
          calcit edit transaction --file migration/option-public031.cirru --expect-revision "$revision" --format json > "$out/applied.json"
          calcit query search 'option:' --source project --format json > "$out/after-search.json"
          jq -e '.data.summary.matches == 0' "$out/after-search.json"
          calcit query config --format json > "$out/after-config.json"
          jq -e '.data.version == "0.7.17"' "$out/after-config.json"
          calcit analyze program-diff HEAD --format json > "$out/program-diff.json"
          jq '{original_revision,scoped_revision,changed,operation_count:(.operations|length)}' "$out/preview.json" > "$out/receipt.json"
          cp calcit.cirru "$out/calcit.cirru"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: phlox-option-migration-source
          path: |
            .calcit/option-migration/calcit.cirru
            .calcit/option-migration/before-blob.txt
            .calcit/option-migration/option-methods.json
            .calcit/option-migration/after-search.json
            .calcit/option-migration/after-config.json
            .calcit/option-migration/program-diff.json
            .calcit/option-migration/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
