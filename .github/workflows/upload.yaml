name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: upload-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Check out repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - name: Set up Calcit and Caps
      uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"
        deps-file: deps.cirru

    - name: Resolve immutable dependencies
      run: |
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain

    - name: Validate Calcit upgrade
      run: |
        set -euo pipefail
        calcit edit format
        git diff --quiet --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only --all-defs --format json
        calcit calcit.cirru fix --workflow strict --verify --format json > /tmp/phlox-strict.json
        jq -e '.data.workflow.status == "passed" and (.diagnostics | length == 0)' /tmp/phlox-strict.json
        calcit calcit.cirru test --require-match
        calcit calcit.cirru analyze weak-types --only dynamic-method --summary-only --format json
        calcit calcit.cirru analyze weak-types --only deprecated-call --summary-only --format json

    - name: Keep unresolved weak types from growing
      env:
        UNRESOLVED_LIMIT: "562"
      run: |
        set -euo pipefail
        actual="$(calcit calcit.cirru analyze weak-types --summary-only --format json | jq -e '.data.summary.intents.unresolved')"
        echo "unresolved weak types: ${actual} (limit ${UNRESOLVED_LIMIT})"
        if (( actual > UNRESOLVED_LIMIT )); then
          echo "::error title=Unresolved weak types grew::${actual} > ${UNRESOLVED_LIMIT}. Type the new positions with concrete types, or keep real host values inside :js-ffi adapters."
          exit 1
        fi
        if (( actual < UNRESOLVED_LIMIT )); then
          echo "::notice title=Unresolved weak types dropped::Lower UNRESOLVED_LIMIT to ${actual} in this workflow."
        fi

    - name: Check out real consumer
      uses: actions/checkout@v7.0.1
      with:
        repository: Phlox-GL/circling-tree
        ref: 5ebbccf0e5cbda2f33d59962ea27be546ac86459
        path: .calcit/consumer
        persist-credentials: false

    - name: Validate real consumer with local candidate
      run: |
        set -euo pipefail
        consumer="$GITHUB_WORKSPACE/.calcit/consumer"
        mkdir -p "$consumer/.calcit/modules/phlox"
        cp -RL .calcit/modules/. "$consumer/.calcit/modules/"
        cp calcit.cirru deps.cirru "$consumer/.calcit/modules/phlox/"
        # Unpublished candidate: explicit local copy, not a Caps-resolved release.
        # Only stage the target graph/runtime; leave consumer Snapshot untouched.
        cat > "$consumer/deps.cirru" <<'EOF'
        {} (:calcit-version |0.32.1)
          :version |0.1.2
          :dependencies $ {} (|Phlox-GL/phlox |0.8.0)
            |Triadica/touch-control |0.0.35
            |calcit-lang/js-ffi |0.2.9
            |mvc-works/pointed-prompt |0.0.24
        EOF
        cd "$consumer"
        yarn add --exact @calcit/procs@0.32.1
        calcit calcit.cirru edit format
        git diff --quiet --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only --all-defs --format json
        calcit calcit.cirru fix --workflow strict --verify --format json > "$RUNNER_TEMP/consumer-strict.json"
        jq -e '.data.workflow.status == "passed" and (.diagnostics | length == 0)' "$RUNNER_TEMP/consumer-strict.json"
        VITE_BASE_URL=./ yarn build

    - name: Preserve PR consumer for interaction acceptance
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: circling-tree-local-candidate
        path: |
          .calcit/consumer/dist
          .calcit/consumer/js-out
          .calcit/consumer/deps.cirru
          .calcit/consumer/package.json
          .calcit/consumer/yarn.lock
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

    - name: Select CDN asset path
      id: asset-path
      env:
        CDN_ORIGIN: https://cos-sh.tiye.me
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/"
        fi
        base_url="${CDN_ORIGIN}/${asset_prefix}"
        echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"

    - name: Build web assets with CDN URLs
      run: |
        yarn compile
        yarn build

    - name: Preserve PR producer for interaction acceptance
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: phlox-preview
        path: dist
        if-no-files-found: error
        retention-days: 7

    - name: Check COS credentials
      id: cos-credentials
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        COS_BUCKET: ${{ secrets.COS_BUCKET }}
        COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
        COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      run: |
        if [[ -n "$COS_BUCKET" && -n "$COS_SECRET_ID" && -n "$COS_SECRET_KEY" ]]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "::warning title=COS upload skipped::Configure COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY to run public upload verification."
          else
            echo "::error title=COS credentials missing::COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY are required for production deployment."
            exit 1
          fi
        fi

    - name: Upload and verify static assets on COS
      if: steps.cos-credentials.outputs.available == 'true'
      uses: worktools/cos-upload-action@v1.2.0
      timeout-minutes: 10
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Verify deployment host key
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        entry_count="$(awk 'NF && $1 !~ /^#/ { count += 1 } END { print count + 0 }' .github/ssh_known_hosts)"
        test "$entry_count" -eq 1
        host_count="$(awk '$1 == "tiye.me" { count += 1 } END { print count + 0 }' .github/ssh_known_hosts)"
        test "$host_count" -eq 1
        host_key="$(awk '$1 == "tiye.me" { print $2 " " $3 }' .github/ssh_known_hosts)"
        actual_fingerprint="$(printf '%s\n' "$host_key" | ssh-keygen -lf - | awk '{ print $2 }')"
        test "$actual_fingerprint" = 'SHA256:f0ME3+UEzCM357Vtdic/bay2ygVUULBJ2pfaPTjBYhg'

    - name: Deploy web assets
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        DEPLOY_KEY: ${{ secrets.rsync_private_key }}
      run: |
        set -euo pipefail
        test -n "$DEPLOY_KEY"
        ssh_dir="$RUNNER_TEMP/phlox-ssh"
        key_file="$ssh_dir/id_ed25519"
        known_hosts_file="$GITHUB_WORKSPACE/.github/ssh_known_hosts"
        install -d -m 700 "$ssh_dir"
        install -m 600 /dev/null "$key_file"
        printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$key_file"
        trap 'rm -f "$key_file"' EXIT
        rsync -avzr --progress \
          -e "ssh -i $key_file -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_file" \
          dist/ "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}/"
